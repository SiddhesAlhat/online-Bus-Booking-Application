<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - BusBook</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">🚌 BusBook Admin</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/admin">Dashboard</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h1>Admin Dashboard</h1>
            <p>Manage buses, routes, and bookings</p>

            <div id="alertBox" class="alert"></div>

            <!-- Stats -->
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; margin: 2rem 0;">
                <div style="background: #f8f9fa; padding: 1.5rem; border-radius: 10px; text-align: center;">
                    <p style="font-size: 2rem; font-weight: 700; color: #667eea;" id="totalBuses">0</p>
                    <p style="color: #666;">Total Buses</p>
                </div>
                <div style="background: #f8f9fa; padding: 1.5rem; border-radius: 10px; text-align: center;">
                    <p style="font-size: 2rem; font-weight: 700; color: #28a745;" id="totalBookings">0</p>
                    <p style="color: #666;">Total Bookings</p>
                </div>
                <div style="background: #f8f9fa; padding: 1.5rem; border-radius: 10px; text-align: center;">
                    <p style="font-size: 2rem; font-weight: 700; color: #ffc107;" id="totalUsers">0</p>
                    <p style="color: #666;">Total Users</p>
                </div>
                <div style="background: #f8f9fa; padding: 1.5rem; border-radius: 10px; text-align: center;">
                    <p style="font-size: 2rem; font-weight: 700; color: #dc3545;" id="totalRevenue">₹0</p>
                    <p style="color: #666;">Revenue</p>
                </div>
            </div>

            <!-- All Bookings -->
            <div style="margin-top: 2rem;">
                <h2>All Bookings</h2>
                <div id="bookingsContainer">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading bookings...</p>
                    </div>
                </div>
            </div>

            <!-- All Routes -->
            <div style="margin-top: 2rem;">
                <h2>All Routes</h2>
                <div id="routesContainer">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading routes...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';

        window.addEventListener('load', () => {
            loadStats();
            loadAllBookings();
            loadAllRoutes();
        });

        // Load stats
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/admin/stats`);
                const data = await response.json();

                if (data.success) {
                    document.getElementById('totalUsers').textContent = data.data.totalUsers;
                    document.getElementById('totalBookings').textContent = data.data.totalBookings;
                    document.getElementById('totalRevenue').textContent = '₹' + data.data.totalRevenue.toFixed(2);
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // READ all bookings from database
        async function loadAllBookings() {
            const container = document.getElementById('bookingsContainer');

            try {
                const response = await fetch(`${API_BASE}/admin/bookings`);
                const data = await response.json();

                if (data.success && data.data.length > 0) {
                    displayBookings(data.data);
                } else {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 2rem;">
                            <h3>No bookings found</h3>
                        </div>
                    `;
                }
            } catch (error) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 2rem;">
                        <h3>⚠️ Error loading bookings</h3>
                    </div>
                `;
                console.error('Error loading bookings:', error);
            }
        }

        function displayBookings(bookings) {
            const container = document.getElementById('bookingsContainer');
            container.innerHTML = '';

            const table = document.createElement('table');
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Ticket #</th>
                        <th>Bus Number</th>
                        <th>Route</th>
                        <th>Seat</th>
                        <th>Travel Date</th>
                        <th>Fare</th>
                        <th>Status</th>
                        <th>Booking Time</th>
                    </tr>
                </thead>
                <tbody id="bookingsTableBody"></tbody>
            `;

            const tbody = table.querySelector('tbody');
            bookings.forEach(booking => {
                const row = document.createElement('tr');
                const statusClass = booking.status.toLowerCase();
                row.innerHTML = `
                    <td>${booking.id}</td>
                    <td>${booking.ticketNumber || 'N/A'}</td>
                    <td>${booking.busNumber}</td>
                    <td>${booking.source} → ${booking.destination}</td>
                    <td>${booking.seatNumber || 'N/A'}</td>
                    <td>${new Date(booking.travelDate).toLocaleDateString()}</td>
                    <td style="font-weight: 700; color: #667eea;">₹${booking.fare}</td>
                    <td><span class="status-badge status-${statusClass}">${booking.status}</span></td>
                    <td>${new Date(booking.bookingTime).toLocaleString()}</td>
                `;
                tbody.appendChild(row);
            });

            container.appendChild(table);
        }

        // READ all routes from database
        async function loadAllRoutes() {
            const container = document.getElementById('routesContainer');

            try {
                const response = await fetch(`${API_BASE}/routes`);
                const data = await response.json();

                if (data.success && data.data.length > 0) {
                    displayRoutes(data.data);
                } else {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 2rem;">
                            <h3>No routes found</h3>
                        </div>
                    `;
                }
            } catch (error) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 2rem;">
                        <h3>⚠️ Error loading routes</h3>
                    </div>
                `;
                console.error('Error loading routes:', error);
            }
        }

        function displayRoutes(routes) {
            const container = document.getElementById('routesContainer');
            container.innerHTML = '';

            const table = document.createElement('table');
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Bus Number</th>
                        <th>Route</th>
                        <th>Type</th>
                        <th>Departure</th>
                        <th>Arrival</th>
                        <th>Fare</th>
                        <th>Total Seats</th>
                        <th>Available</th>
                    </tr>
                </thead>
                <tbody id="routesTableBody"></tbody>
            `;

            const tbody = table.querySelector('tbody');
            routes.forEach(route => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${route.id}</td>
                    <td>${route.busNumber}</td>
                    <td>${route.source} → ${route.destination}</td>
                    <td><span class="bus-type">${route.busType}</span></td>
                    <td>${route.departureTime}</td>
                    <td>${route.arrivalTime}</td>
                    <td style="font-weight: 700; color: #667eea;">₹${route.fare}</td>
                    <td>${route.totalSeats}</td>
                    <td style="color: #28a745; font-weight: 600;">${route.availableSeats}</td>
                `;
                tbody.appendChild(row);
            });

            container.appendChild(table);

            // Update bus count
            document.getElementById('totalBuses').textContent = routes.length;
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alertBox');
            alert.textContent = message;
            alert.className = `alert ${type}`;
            alert.style.display = 'block';
            setTimeout(() => alert.style.display = 'none', 3000);
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login';
        }
    </script>
</body>
</html>
