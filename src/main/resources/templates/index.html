<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Booking - Home</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">🚌 BusBook</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/search">Search</a>
            <a href="/bookings">My Bookings</a>
            <a href="/login" id="authLink">Login</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h1>Book Your Bus Tickets</h1>
            <p class="subtitle">Fast, Easy, and Secure</p>

            <div id="alertBox" class="alert"></div>

            <div class="form-card">
                <form id="searchForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="source">🔵 From</label>
                            <select id="source" required>
                                <option value="">Select Source</option>
                                <option value="Mumbai">Mumbai</option>
                                <option value="Delhi">Delhi</option>
                                <option value="Bangalore">Bangalore</option>
                                <option value="Hyderabad">Hyderabad</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="destination">🔴 To</label>
                            <select id="destination" required>
                                <option value="">Select destination</option>
                                <option value="Pune">Pune</option>
                                <option value="Jaipur">Jaipur</option>
                                <option value="Chennai">Chennai</option>
                                <option value="Goa">Goa</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="travelDate">📅 Travel Date</label>
                        <input type="date" id="travelDate" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Search Buses</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        // Initialize
        const initPage = () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('travelDate').min = today;
            document.getElementById('travelDate').value = today;

            const userName = localStorage.getItem('userName');
            if (userName) {
                document.getElementById('authLink').textContent = userName;
            }
        };

        // Handle search
        const handleSearch = (e) => {
            e.preventDefault();
            const searchData = {
                source: document.getElementById('source').value,
                destination: document.getElementById('destination').value,
                travelDate: document.getElementById('travelDate').value
            };
            
            sessionStorage.setItem('searchData', JSON.stringify(searchData));
            window.location.href = '/search';
        };

        // Event listeners
        window.addEventListener('load', initPage);
        document.getElementById('searchForm').addEventListener('submit', handleSearch);
    </script>
</body>
</html>
