<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Buses - BusBook</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">🚌 BusBook</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/search">Search</a>
            <a href="/bookings">My Bookings</a>
            <a href="/login" id="authLink">Login</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h1>Search Buses</h1>
            <div id="alertBox" class="alert"></div>

            <!-- Search Form -->
            <div class="form-card">
                <form id="searchForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>From</label>
                            <select id="source" required>
                                <option value="">Select Source</option>
                                <option value="Mumbai">Mumbai</option>
                                <option value="Delhi">Delhi</option>
                                <option value="Bangalore">Bangalore</option>
                                <option value="Hyderabad">Hyderabad</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>To</label>
                            <select id="destination" required>
                                <option value="">Select Destination</option>
                                <option value="Pune">Pune</option>
                                <option value="Jaipur">Jaipur</option>
                                <option value="Chennai">Chennai</option>
                                <option value="Goa">Goa</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Travel Date</label>
                        <input type="date" id="travelDate" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Search Buses</button>
                </form>
            </div>

            <!-- Results -->
            <div id="resultsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading buses...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        
        document.getElementById('travelDate').min = new Date().toISOString().split('T')[0];
        document.getElementById('travelDate').value = new Date().toISOString().split('T')[0];

        window.addEventListener('load', () => {
            const userName = localStorage.getItem('userName');
            if (userName) {
                document.getElementById('authLink').textContent = userName;
            }

            const searchData = sessionStorage.getItem('searchData');
            if (searchData) {
                const {source, destination, travelDate} = JSON.parse(searchData);
                document.getElementById('source').value = source;
                document.getElementById('destination').value = destination;
                document.getElementById('travelDate').value = travelDate;
                searchBuses();
            }
        });

        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            searchBuses();
        });

        // READ buses from database
        async function searchBuses() {
            const source = document.getElementById('source').value;
            const destination = document.getElementById('destination').value;
            const travelDate = document.getElementById('travelDate').value;

            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = '<div class="loading"><div class="spinner"></div><p>Searching buses...</p></div>';

            try {
                const response = await fetch(`${API_BASE}/routes/search`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({source, destination, travelDate})
                });

                const data = await response.json();

                if (data.success && data.data.length > 0) {
                    displayBuses(data.data);
                } else {
                    resultsContainer.innerHTML = `
                        <div style="text-align: center; padding: 2rem;">
                            <h3>😔 No buses found</h3>
                            <p>Try different routes or dates</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultsContainer.innerHTML = `
                    <div style="text-align: center; padding: 2rem;">
                        <h3>⚠️ Error loading buses</h3>
                        <p>Please try again</p>
                    </div>
                `;
                console.error('Search error:', error);
            }
        }

        function displayBuses(buses) {
            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = '<h2 style="margin: 2rem 0 1rem;">Available Buses</h2>';
            
            const busList = document.createElement('div');
            busList.className = 'bus-list';

            buses.forEach(bus => {
                const busCard = document.createElement('div');
                busCard.className = 'bus-card';
                busCard.innerHTML = `
                    <div class="bus-info">
                        <h3>${bus.busNumber}</h3>
                        <span class="bus-type">${bus.busType}</span>
                        <p style="color: #666; margin-top: 0.5rem;">${bus.source} → ${bus.destination}</p>
                    </div>
                    <div style="text-align: center;">
                        <p style="font-size: 1.5rem; font-weight: 700;">${bus.departureTime}</p>
                        <p style="color: #666;">Departure</p>
                    </div>
                    <div style="text-align: center;">
                        <p style="font-size: 1.5rem; font-weight: 700; color: #667eea;">₹${bus.fare}</p>
                        <p style="color: #666;">per seat</p>
                    </div>
                    <div style="text-align: center;">
                        <p style="font-size: 1.3rem; font-weight: 700; color: #28a745;">${bus.availableSeats}</p>
                        <p style="color: #666;">seats left</p>
                    </div>
                    <button class="btn btn-success" onclick="bookBus(${bus.id}, '${bus.busNumber}', '${bus.source}', '${bus.destination}', ${bus.fare}, '${bus.departureTime}')">Book Now</button>
                `;
                busList.appendChild(busCard);
            });

            resultsContainer.appendChild(busList);
        }

        // Redirect to seat selection page
        function bookBus(busId, busNumber, source, destination, fare, departureTime) {
            const userPhone = localStorage.getItem('userPhone');
            if (!userPhone) {
                alert('Please login to book tickets');
                window.location.href = '/login';
                return;
            }

            const travelDate = document.getElementById('travelDate').value;

            // Redirect to seat selection page with bus details
            const params = new URLSearchParams({
                busId: busId,
                busNumber: busNumber,
                source: source,
                destination: destination,
                fare: fare,
                departure: departureTime,
                travelDate: travelDate
            });

            window.location.href = `/seat-selection?${params.toString()}`;
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alertBox');
            alert.textContent = message;
            alert.className = `alert ${type}`;
            alert.style.display = 'block';
        }
    </script>
</body>
</html>
