<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - BusBook</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">🚌 BusBook</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/search">Search</a>
            <a href="/bookings">My Bookings</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h1>My Bookings</h1>
            <p>View and manage your bus tickets</p>

            <div id="alertBox" class="alert"></div>

            <div id="bookingsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading bookings...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';

        window.addEventListener('load', () => {
            const userPhone = localStorage.getItem('userPhone');
            if (!userPhone) {
                window.location.href = '/login';
                return;
            }
            loadBookings();
        });

        // READ bookings from database
        async function loadBookings() {
            const userPhone = localStorage.getItem('userPhone');
            const container = document.getElementById('bookingsContainer');

            try {
                const response = await fetch(`${API_BASE}/bookings`, {
                    headers: {'X-User-Phone': userPhone}
                });

                const data = await response.json();

                if (data.success && data.data.length > 0) {
                    displayBookings(data.data);
                } else {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 3rem;">
                            <h3>📋 No bookings found</h3>
                            <p>Start booking your bus tickets now!</p>
                            <a href="/search" class="btn btn-primary" style="margin-top: 1rem;">Search Buses</a>
                        </div>
                    `;
                }
            } catch (error) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 3rem;">
                        <h3>⚠️ Error loading bookings</h3>
                        <p>Please try again</p>
                    </div>
                `;
                console.error('Error loading bookings:', error);
            }
        }

        function displayBookings(bookings) {
            const container = document.getElementById('bookingsContainer');
            container.innerHTML = '';

            bookings.forEach(booking => {
                const statusClass = `status-${booking.status.toLowerCase()}`;
                const bookingCard = document.createElement('div');
                bookingCard.className = 'booking-card';
                bookingCard.innerHTML = `
                    <div class="booking-header">
                        <div>
                            <h3>Ticket #${booking.ticketNumber || booking.id}</h3>
                            <p style="color: #666;">Booking ID: ${booking.id}</p>
                        </div>
                        <span class="status-badge ${statusClass}">${booking.status}</span>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1rem;">
                        <div>
                            <h4 style="color: #666; font-size: 0.85rem;">Bus Number</h4>
                            <p style="font-weight: 600;">${booking.busNumber || 'N/A'}</p>
                        </div>
                        <div>
                            <h4 style="color: #666; font-size: 0.85rem;">Route</h4>
                            <p style="font-weight: 600;">${booking.source || 'N/A'} → ${booking.destination || 'N/A'}</p>
                        </div>
                        <div>
                            <h4 style="color: #666; font-size: 0.85rem;">Travel Date</h4>
                            <p style="font-weight: 600;">${new Date(booking.travelDate).toLocaleDateString()}</p>
                        </div>
                        <div>
                            <h4 style="color: #666; font-size: 0.85rem;">Seat Number</h4>
                            <p style="font-weight: 600;">${booking.seatNumber || 'N/A'}</p>
                        </div>
                        <div>
                            <h4 style="color: #666; font-size: 0.85rem;">Fare</h4>
                            <p style="font-weight: 600; color: #667eea;">₹${booking.fare}</p>
                        </div>
                        <div>
                            <h4 style="color: #666; font-size: 0.85rem;">Booking Time</h4>
                            <p style="font-weight: 600;">${new Date(booking.bookingTime).toLocaleDateString()}</p>
                        </div>
                    </div>
                    <div style="display: flex; gap: 1rem;">
                        ${booking.status === 'CONFIRMED' ? `
                            <button class="btn btn-primary" onclick="viewTicketPage(${booking.id})">🎫 View Ticket</button>
                            <button class="btn btn-danger" onclick="cancelBooking(${booking.id})">Cancel Booking</button>
                        ` : ''}
                    </div>
                `;
                container.appendChild(bookingCard);
            });
        }

        // Redirect to ticket page
        function viewTicketPage(bookingId) {
            window.location.href = `/ticket?bookingId=${bookingId}`;
        }

        // View ticket with QR code (old function - kept for backward compatibility)
        async function viewTicket(bookingId) {
            const userPhone = localStorage.getItem('userPhone');

            try {
                const response = await fetch(`${API_BASE}/bookings/${bookingId}/ticket`, {
                    headers: {'X-User-Phone': userPhone}
                });

                const data = await response.json();

                if (data.success) {
                    alert(`Ticket Details:\n\nTicket Number: ${data.data.ticketNumber}\nPassenger: ${data.data.passengerName}\nBus: ${data.data.busNumber}\nSeat: ${data.data.seatNumber}\n\nQR Code: ${data.data.qrCode}`);
                } else {
                    showAlert('Error loading ticket', 'error');
                }
            } catch (error) {
                showAlert('Error loading ticket', 'error');
                console.error('Ticket error:', error);
            }
        }

        // DELETE booking from database
        async function cancelBooking(bookingId) {
            if (!confirm('Are you sure you want to cancel this booking?')) {
                return;
            }

            const userPhone = localStorage.getItem('userPhone');

            // Find the booking data before cancelling
            const bookings = await getUserBookingsData();
            const booking = bookings.find(b => b.id === bookingId);

            try {
                const response = await fetch(`${API_BASE}/bookings/${bookingId}`, {
                    method: 'DELETE',
                    headers: {'X-User-Phone': userPhone}
                });

                const data = await response.json();

                if (data.success) {
                    // Store cancellation data in sessionStorage
                    if (booking) {
                        sessionStorage.setItem('cancellationData', JSON.stringify({
                            bookingId: booking.id,
                            busNumber: booking.busNumber,
                            source: booking.source,
                            destination: booking.destination,
                            seatNumber: booking.seatNumber,
                            travelDate: booking.travelDate,
                            fare: booking.fare
                        }));
                    }
                    
                    // Redirect to cancellation page
                    window.location.href = '/cancellation';
                } else {
                    showAlert('❌ Failed to cancel: ' + data.message, 'error');
                }
            } catch (error) {
                showAlert('❌ Error cancelling booking', 'error');
                console.error('Cancel error:', error);
            }
        }

        // Helper function to get booking data
        async function getUserBookingsData() {
            const userPhone = localStorage.getItem('userPhone');
            try {
                const response = await fetch(`${API_BASE}/bookings`, {
                    headers: {'X-User-Phone': userPhone}
                });
                const data = await response.json();
                return data.success ? data.data : [];
            } catch (error) {
                console.error('Error fetching bookings:', error);
                return [];
            }
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alertBox');
            alert.textContent = message;
            alert.className = `alert ${type}`;
            alert.style.display = 'block';
            setTimeout(() => alert.style.display = 'none', 3000);
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login';
        }
    </script>
</body>
</html>
