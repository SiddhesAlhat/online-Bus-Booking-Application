<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BusBook</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">🚌 BusBook</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/login">Login</a>
        </div>
    </nav>

    <div class="container">
        <div class="card" style="max-width: 500px; margin: 2rem auto;">
            <h1>Welcome Back!</h1>
            <p>Login or create a new account</p>

            <div id="alertBox" class="alert"></div>

            <!-- Tabs -->
            <div style="display: flex; gap: 1rem; margin-bottom: 2rem;">
                <button class="btn btn-primary" onclick="showTab('login')" id="loginTab" style="flex: 1;">Login</button>
                <button class="btn btn-secondary" onclick="showTab('register')" id="registerTab" style="flex: 1;">Register</button>
            </div>

            <!-- Login Form -->
            <div id="loginForm">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="loginPhone" placeholder="10-digit mobile number" 
                               pattern="[0-9]{10}" maxlength="10" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                        <span id="loginBtnText">Login</span>
                    </button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="registerForm" style="display: none;">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="regName" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="regEmail" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="regPhone" placeholder="10-digit mobile number" 
                               pattern="[0-9]{10}" maxlength="10" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="regPassword" placeholder="Create password (min 6 chars)" 
                               minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full" id="registerBtn">
                        <span id="registerBtnText">Create Account</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';

        function showTab(tab) {
            if (tab === 'login') {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('loginTab').className = 'btn btn-primary';
                document.getElementById('registerTab').className = 'btn btn-secondary';
            } else {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('loginTab').className = 'btn btn-secondary';
                document.getElementById('registerTab').className = 'btn btn-primary';
            }
            hideAlert();
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alertBox');
            alert.textContent = message;
            alert.className = `alert ${type}`;
            alert.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('alertBox').style.display = 'none';
        }

        // LOGIN - READ from database
        async function handleLogin(event) {
            event.preventDefault();
            const phone = document.getElementById('loginPhone').value;
            const password = document.getElementById('loginPassword').value;

            document.getElementById('loginBtnText').textContent = 'Logging in...';
            document.getElementById('loginBtn').disabled = true;

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({phone, password})
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('userPhone', data.data.phone);
                    localStorage.setItem('userName', data.data.name);
                    localStorage.setItem('userEmail', data.data.email);
                    
                    showAlert('Login successful! Redirecting...', 'success');
                    setTimeout(() => window.location.href = '/', 1000);
                } else {
                    showAlert(data.message || 'Login failed', 'error');
                }
            } catch (error) {
                showAlert('Error connecting to server', 'error');
                console.error('Login error:', error);
            } finally {
                document.getElementById('loginBtnText').textContent = 'Login';
                document.getElementById('loginBtn').disabled = false;
            }
        }

        // REGISTER - INSERT into database
        async function handleRegister(event) {
            event.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const phone = document.getElementById('regPhone').value;
            const password = document.getElementById('regPassword').value;

            document.getElementById('registerBtnText').textContent = 'Creating account...';
            document.getElementById('registerBtn').disabled = true;

            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name, email, phone, password})
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('userPhone', data.data.phone);
                    localStorage.setItem('userName', data.data.name);
                    localStorage.setItem('userEmail', data.data.email);
                    
                    showAlert('Registration successful! Redirecting...', 'success');
                    setTimeout(() => window.location.href = '/', 1000);
                } else {
                    showAlert(data.message || 'Registration failed', 'error');
                }
            } catch (error) {
                showAlert('Error connecting to server', 'error');
                console.error('Registration error:', error);
            } finally {
                document.getElementById('registerBtnText').textContent = 'Create Account';
                document.getElementById('registerBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
